name: generate metrics

on:
  schedule:
    - cron: "15 19 * * *" # 00:45 IST
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Full-history contribution calendar (2015 → now)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ankit373
          filename: metrics-calendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_calendar: yes
          plugin_calendar_limit: 0
